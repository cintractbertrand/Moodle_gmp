<main>
<h1>Fonctions trigonométriques réciproques : les animations du cours</h1>
<p>Chaque animation reprend un passage du cours. Appuie sur Lecture, ou avance à ton rythme avec Suivant.</p>

<script>
/* =================== calcul exact =================== */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function F(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}}
const add=(x,y)=>F(x.n*y.d+y.n*x.d,x.d*y.d),sub=(x,y)=>F(x.n*y.d-y.n*x.d,x.d*y.d),mul=(x,y)=>F(x.n*y.n,x.d*y.d),dv=(x,y)=>F(x.n*y.d,x.d*y.n);
const isz=x=>x.n===0, fs=x=>x.d===1?String(x.n):x.n+"/"+x.d, fnum=x=>x.n/x.d;
const sup=n=>String(n).split("").map(c=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("");
const sub_=n=>String(n).split("").map(c=>"₀₁₂₃₄₅₆₇₈₉"[+c]).join("");
/* un polynôme = objet {puissance: Fraction} sans coefficient nul */
function clean(m){const r={};for(const k in m)if(!isz(m[k]))r[k]=m[k];return r}
function fromDesc(a){const m={};a.forEach((c,i)=>{m[a.length-1-i]=typeof c==="number"?F(c):c});return clean(m)}
function fromAsc(a){const m={};a.forEach((c,i)=>{m[i]=typeof c==="number"?F(c):c});return clean(m)}
const pows=m=>Object.keys(m).map(Number).sort((a,b)=>a-b);
const deg=m=>{const p=pows(m);return p.length?p[p.length-1]:-1};
const low=m=>{const p=pows(m);return p.length?p[0]:-1};
const empty=m=>pows(m).length===0;
function padd(a,b){const r={...a};for(const k in b)r[k]=r[k]?add(r[k],b[k]):b[k];return clean(r)}
function pscale(a,c){const r={};for(const k in a)r[k]=mul(a[k],c);return clean(r)}
function pshift(a,s){const r={};for(const k in a)r[+k+s]=a[k];return r}
const psub=(a,b)=>padd(a,pscale(b,F(-1)));
function pmul(a,b){let r={};for(const i in a)for(const j in b){const p=+i+ +j;r[p]=r[p]?add(r[p],mul(a[i],b[j])):mul(a[i],b[j])}return clean(r)}
function pderiv(a){const r={};for(const k in a)if(+k>0)r[k-1]=mul(a[k],F(+k));return clean(r)}
function peval(a,x){let s=F(0);for(const k in a){let t=F(1);for(let i=0;i<+k;i++)t=mul(t,x);s=add(s,mul(a[k],t))}return s}
function pevalF(a,x){let s=0;for(const k in a)s+=fnum(a[k])*Math.pow(x,+k);return s}
const peq=(a,b)=>empty(psub(a,b));
let VAR="x";
function term(c,p,first){if(isz(c))return"";const neg=c.n<0,ab=F(Math.abs(c.n),c.d);
 let b=(p>0&&ab.n===1&&ab.d===1)?"":(ab.d===1||p===0?fs(ab):"("+fs(ab)+")");
 b+=p>0?(p===1?VAR:VAR+sup(p)):"";
 return first?(neg?"−"+b:b):(neg?"− ":"+ ")+b}
function pstr(m,asc){const p=pows(m);if(!p.length)return"0";if(!asc)p.reverse();let o="";p.forEach((k,i)=>{const t=term(m[k],k,i===0);o+=(i&&t.startsWith("")?" ":"")+t});return o}
const one=(c,p)=>term(c,p,true);
function parseList(s){return s.split(/[,;\s]+/).filter(Boolean).map(t=>{const m=t.match(/^(-?\d+)(?:\/(\d+))?$/);if(!m||(m[2]&&+m[2]===0))throw 0;return F(+m[1],m[2]?+m[2]:1)})}

/* =================== division (décroissante ou croissante) =================== */
function divModel(A,B,asc,order){
 const its=[];let R={...A};const dB=deg(B);
 if(!asc){while(!empty(R)&&deg(R)>=dB){const lp=deg(R),qp=lp-dB,c=dv(R[lp],B[dB]);const prod=pscale(pshift(B,qp),c);const Rn=psub(R,prod);its.push({lp,qp,c,prod,Rold:R,Rn});R=Rn}}
 else{for(let s=0;s<=order;s++){const c=R[s]?dv(R[s],B[0]):F(0);const prod=pscale(pshift(B,s),c);const Rn=psub(R,prod);its.push({lp:s,qp:s,c,prod,Rold:R,Rn});R=Rn}}
 const Q={};its.forEach(it=>{if(!isz(it.c))Q[it.qp]=it.c});
 const dA=deg(A);
 let colsL,colsR;
 if(!asc){const wp=Math.max(dB,dA-dB,0);colsL=range(dA,0,-1);colsR=range(wp,0,-1)}
 else{const mp=Math.max(dA,order+dB);colsL=range(0,mp,1);colsR=range(0,Math.max(dB,order),1)}
 return{A,B,asc,order,its,Q,R,dA,dB,colsL,colsR,N:4*its.length+1};
}
function range(a,b,s){const r=[];for(let i=a;s>0?i<=b:i>=b;i+=s)r.push(i);return r}
function divCheck(D){return peq(padd(pmul(D.B,D.Q),D.R),D.A)}
function divSay(D,t){
 const {A,B,asc,its,order,dB}=D;
 if(t===0)return asc?`On pose la DSPC à l'ordre <b>${order}</b> : on range A et B <b>suivant les puissances croissantes</b>. On veut A = B×Q + ${VAR}<sup>${order+1}</sup>×R avec deg Q ≤ ${order}.`
  :`On pose la division : <b>A = ${pstr(A)}</b> à gauche, <b>B = ${pstr(B)}</b> à droite. On veut A = B×Q + R avec deg R &lt; deg B = ${dB}.`+(D.dA<dB?" Ici deg A &lt; deg B : la division est déjà finie.":"");
 if(t===D.N){
  if(asc){const Rp={};for(const k in D.R)Rp[k-order-1]=D.R[k];return `On s'arrête à l'ordre ${order}. <b>Q = ${pstr(D.Q,true)}</b> et le reste est <b>${pstr(D.R,true)} = ${VAR}${sup(order+1)}×(${pstr(Rp,true)})</b>.`}
  return D.R&&!empty(D.R)?`Le reste <b>${pstr(D.R)}</b> a pour degré ${deg(D.R)}, strictement inférieur à ${dB} : on s'arrête. <b>Q = ${pstr(D.Q)}</b> et <b>R = ${pstr(D.R)}</b>.`
   :`Le reste est nul : on s'arrête. <b>Q = ${pstr(D.Q)}</b> et <b>R = 0</b>, donc B divise A.`}
 const i=Math.floor((t-1)/4),ph=(t-1)%4,it=its[i];
 const src=i?"le reste":"A";
 const lr=one(it.Rold[it.lp]||F(0),it.lp),lb=asc?one(B[0],0):one(B[dB],dB),q=one(it.c,it.qp),zero=isz(it.c);
 const lead=asc?"de plus bas degré":"de plus haut degré";
 if(ph===0)return `<b>Étape ${i+1}.</b> On regarde seulement les termes ${lead} : <mark>${lr||"0"}</mark> dans ${src} et <mark>${lb}</mark> dans B.`;
 if(ph===1)return zero?`Le terme de degré ${it.lp} du reste est nul : le terme du quotient est <mark>0</mark>.`:`Par quoi faut-il multiplier ${lb} pour obtenir ${lr} ? ${lr} ÷ ${lb} = <mark>${q}</mark>. On l'écrit au quotient, sous B.`;
 if(ph===2)return zero?`0 × B = 0 : il n'y a rien à écrire.`:`On multiplie <b>tout</b> B par ${q} et on écrit le résultat sous ${src}, en alignant les puissances de X : ${q}·B = ${pstr(it.prod,asc)}.`;
 const Rn=it.Rn;return zero?`Rien à soustraire, on passe au terme suivant.`:`On soustrait la parenthèse, c'est-à-dire qu'on change tous ses signes : le terme de degré ${it.lp} disparaît. Il reste <mark>${empty(Rn)?"0":pstr(Rn,asc)}</mark>.`;
}
function divBoard(D,t){
 const {A,B,asc,its,N,colsL,colsR,dB}=D;
 const cur=t>0&&t<N?{i:Math.floor((t-1)/4),ph:(t-1)%4}:null;
 const reached=(i,ph)=>t>=4*i+ph+1;
 const row=(m,cols,cls,lab,rule)=>{let seen=false;return `<tr><td class="lab">${lab||""}</td>`+cols.map(p=>{const v=m[p];const tt=v?term(v,p,!seen):"";if(tt)seen=true;return `<td class="${(cls&&cls(p))||""} ${rule?"rule":""}">${tt}</td>`}).join("")+`<td class="lab">${lab?")":""}</td></tr>`};
 let L=row(A,colsL,p=>cur&&cur.i===0&&cur.ph<=1&&its[0]&&p===its[0].lp?"hl":"","");
 its.forEach((it,i)=>{const isCur=cur&&cur.i===i;
  if(reached(i,2)&&!isz(it.c))L+=row(it.prod,colsL,()=>isCur&&cur.ph===2?"hk":"","− (");
  if(reached(i,3)&&!isz(it.c)){const nx=its[i+1];L+=row(it.Rn,colsL,p=>isCur&&cur.ph===3?"hk":(cur&&cur.i===i+1&&cur.ph<=1&&nx&&p===nx.lp?"hl":""),"",true)}
 });
 const leadB=asc?0:dB;
 let seenB=false,seenQ=false;
 const RB=`<tr>`+colsR.map(p=>{const c=B[p];const tt=c?term(c,p,!seenB):"";if(tt)seenB=true;return `<td class="${cur&&cur.ph<=1&&p===leadB?"hl":""}">${tt}</td>`}).join("")+`</tr>`;
 const RQ=`<tr>`+colsR.map(p=>{let v=null,h="";its.forEach((it,i)=>{if(it.qp===p&&reached(i,1)){v=it.c;if(cur&&cur.i===i&&cur.ph===1)h="hq"}});const tt=v&&!isz(v)?term(v,p,!seenQ):"";if(tt)seenQ=true;return `<td class="rule ${h}">${tt}</td>`}).join("")+`</tr>`;
 let out=`<div class="board"><div class="left"><table>${L}</table></div><div class="right"><table>${RB+RQ}</table></div></div>`;
 if(t===N)out+=`<div class="res">A = B·Q + ${D.asc?"reste":"R"}<br>(${pstr(B,asc)})·(${pstr(D.Q,asc)}) + (${empty(D.R)?"0":pstr(D.R,asc)})<br><span class="${divCheck(D)?"ok":"err"}">Vérification : B·Q + R = A ${divCheck(D)?"✓":"✗"}</span></div>`;
 return out;
}
function divSteps(D,extra){const s=[];for(let t=0;t<=D.N;t++)s.push({say:divSay(D,t),board:divBoard(D,t)});return s}

/* =================== dessins =================== */
function niceTicks(a,b){const span=b-a;let st=Math.pow(10,Math.floor(Math.log10(span/4)));if(span/st>8)st*=2;if(span/st>8)st*=2.5;const r=[];for(let v=Math.ceil(a/st)*st;v<=b+1e-9;v+=st)r.push(Math.round(v/st)*st);return r}
function graphSvg(o){const W=380,H=240,pl=30,pr=14,pt=14,pb=24;const {f,xmin,xmax}=o;let {ymin,ymax}=o;
 if(ymin===undefined){let lo=1e9,hi=-1e9;for(let i=0;i<=200;i++){const y=f(xmin+(xmax-xmin)*i/200);lo=Math.min(lo,y);hi=Math.max(hi,y)}const pad=(hi-lo)*0.12||1;ymin=Math.min(lo,0)-pad;ymax=Math.max(hi,0)+pad}
 const X=x=>pl+(x-xmin)/(xmax-xmin)*(W-pl-pr),Y=y=>pt+(ymax-y)/(ymax-ymin)*(H-pt-pb);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||"graphe"}">`;
 niceTicks(xmin,xmax).forEach(v=>{s+=`<line class="gr" x1="${X(v)}" y1="${pt}" x2="${X(v)}" y2="${H-pb}"/><text x="${X(v)}" y="${H-pb+13}" text-anchor="middle">${+v.toFixed(2)}</text>`});
 niceTicks(ymin,ymax).forEach(v=>{s+=`<line class="gr" x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}"/><text x="${pl-4}" y="${Y(v)+4}" text-anchor="end">${+v.toFixed(2)}</text>`});
 if(ymin<0&&ymax>0)s+=`<line class="ax" x1="${pl}" y1="${Y(0)}" x2="${W-pr}" y2="${Y(0)}"/>`;
 if(xmin<0&&xmax>0)s+=`<line class="ax" x1="${X(0)}" y1="${pt}" x2="${X(0)}" y2="${H-pb}"/>`;
 let d="",pen=false;for(let i=0;i<=240;i++){const x=xmin+(xmax-xmin)*i/240,y=f(x);if(y<ymin||y>ymax){pen=false;continue}d+=(pen?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1)+" ";pen=true}
 s+=`<path class="cv" d="${d}"/>`;
 (o.marks||[]).forEach(m=>{if(m.drop)s+=`<line class="dsh" x1="${X(m.x)}" y1="${Y(m.y)}" x2="${X(m.x)}" y2="${Y(0)}"/>`;
  s+=`<circle class="${m.ok?"pk":"pt"}" cx="${X(m.x)}" cy="${Y(m.y)}" r="5"/>`;if(m.label)s+=`<text x="${X(m.x)+7}" y="${Y(m.y)-7}">${m.label}</text>`});
 return s+"</svg>"}
function planeSvg(o){const S=300,R=o.R,pad=18,C=S/2;const X=x=>C+x/R*(C-pad),Y=y=>C-y/R*(C-pad);
 let s=`<svg viewBox="0 0 ${S} ${S}" style="max-width:320px" role="img" aria-label="plan complexe">`;
 for(let v=-Math.floor(R);v<=Math.floor(R);v++){if(!v)continue;s+=`<line class="gr" x1="${X(v)}" y1="${pad/2}" x2="${X(v)}" y2="${S-pad/2}"/><line class="gr" x1="${pad/2}" y1="${Y(v)}" x2="${S-pad/2}" y2="${Y(v)}"/><text x="${X(v)}" y="${C+12}" text-anchor="middle">${String(v).replace("-","−")}</text><text x="${C-4}" y="${Y(v)+4}" text-anchor="end">${v===1?"i":v===-1?"−i":String(v).replace("-","−")+"i"}</text>`}
 s+=`<line class="ax" x1="${pad/2}" y1="${C}" x2="${S-pad/2}" y2="${C}"/><line class="ax" x1="${C}" y1="${pad/2}" x2="${C}" y2="${S-pad/2}"/>`;
 if(o.circle)s+=`<circle class="pe" cx="${C}" cy="${C}" r="${(o.circleR||1)/R*(C-pad)}" style="stroke-dasharray:3 3"/>`;
 if(o.poly){s+=`<polyline class="vec" fill="none" points="${o.poly.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}${o.closed?" "+X(o.poly[0][0]).toFixed(1)+","+Y(o.poly[0][1]).toFixed(1):""}"/>`}
 (o.links||[]).forEach(l=>{s+=`<line class="dsh" x1="${X(l[0])}" y1="${Y(l[1])}" x2="${X(l[2])}" y2="${Y(l[3])}"/>`});
